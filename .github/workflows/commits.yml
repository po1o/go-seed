name: Validate Commits

on: [pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# commitlint reads the PR's commit list via the API — needs pull-requests:read.
# New repos default the GITHUB_TOKEN to contents+metadata read only, so without
# this the action fails with "Resource not accessible by integration" on every
# PR (Dependabot's included).
permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: commit check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate commit messages
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed
        with:
          configFile: .commitlintrc.cjs
